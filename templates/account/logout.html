<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выход из системы</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .card {
            background: #ffffff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .card h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #1a1a1a;
        }

        .card p {
            color: #666;
            font-size: 15px;
            margin-bottom: 24px;
        }

        .messages {
            list-style: none;
            margin-bottom: 20px;
        }

        .messages li {
            background-color: #eef2ff;
            color: #4338ca;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .btn-submit {
            width: 100%;
            background-color: #e11d48;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #be123c;
        }

        .btn-cancel {
            display: block;
            margin-top: 12px;
            color: #6b7280;
            text-decoration: none;
            font-size: 14px;
        }

        .btn-cancel:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Уведомления Django -->
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <h1>Выход из системы</h1>
        <p>Вы уверены, что хотите выйти из своего аккаунта?</p>

        <!-- Форма выхода django-allauth -->
        <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}
            {% if redirect_field_value %}
                <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}"/>
            {% endif %}
            <button class="btn-submit" type="submit">Выйти</button>
        </form>

        <a href="/" class="btn-cancel">Отмена</a>
    </div>

</body>
</html>
