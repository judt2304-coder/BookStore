<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .register-card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
        }
        .btn-orange {
            background-color: #fd7e14;
            color: white;
            font-weight: 600;
            border: none;
            width: 100%;
            padding: 0.6rem;
        }
        .btn-orange:hover {
            background-color: #e86b02;
            color: white;
        }
        .form-control:focus {
            border-color: #fd7e14;
            box-shadow: 0 0 0 0.25rem rgba(253, 126, 20, 0.25);
        }
        .link-orange {
            color: #fd7e14;
            text-decoration: none;
        }
        .link-orange:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="register-card">
    <h3 class="text-center fw-bold mb-4">Регистрация</h3>

    <form method="post" action="{% url 'account_signup' %}">
        {% csrf_token %}

        {% if form.non_field_errors %}
            <div class="alert alert-danger p-2 small">
                {% for error in form.non_field_errors %}
                    {{ error }}
                {% endfor %}
            </div>
        {% endif %}

        {% for field in form %}
            <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label small fw-semibold text-secondary">
                    {{ field.label }}
                </label>
                <input type="{{ field.field.widget.input_type|default:'text' }}"
                       name="{{ field.name }}"
                       id="{{ field.id_for_label }}"
                       class="form-control"
                       placeholder="{{ field.label }}"
                       {% if field.value %}value="{{ field.value }}"{% endif %}>
                {% if field.errors %}
                    <div class="text-danger small mt-1">
                        {% for error in field.errors %}
                            {{ error }}
                        {% endfor %}
                    </div>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit" class="btn btn-orange mt-2 mb-3">Зарегистрироваться</button>
    </form>

    <div class="text-center pt-3 border-top">
        <span class="small text-muted">Уже есть аккаунт?</span>
        <a href="{% url 'account_login' %}" class="small link-orange fw-bold ms-1">Войти</a>
    </div>
</div>

</body>
</html>
